            if (currentIndex > 0 && currentIndex % 5 === 0) {
                const isLui = Math.random() < 0.5;
                const sourceList = isLui ? planifiedDefisLui : planifiedDefisElle;
                
                if (sourceList.length > 0) {
                    const randomIndex = Math.floor(Math.random() * sourceList.length);
                    const selectedDefi = sourceList[randomIndex];
                    cardText.innerHTML = `<strong>⚡ DÉFI EXCLUSIF (${isLui ? 'Pour lui ♂️' : 'Pour elle ♀️'}) :</strong><br><br>${selectedDefi}`;
                } else {
                    cardText.innerHTML = activeQuestions[currentIndex % activeQuestions.length];
                }
            } else {
                cardText.innerHTML = activeQuestions[currentIndex % activeQuestions.length];
            }
        }

        function nextCard() {
            currentIndex++;
            displayCard();
        }

        // Gestion Modals
        function openDailyChallengeModal() {
            document.getElementById('modal-daily').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('modal-daily').style.display = 'none';
            document.getElementById('modal-generic').style.display = 'none';
            document.getElementById('levels-container').style.display = 'grid';
            document.getElementById('card-display').style.display = 'none';
        }

        function drawDaily(target) {
            const list = target === 'lui' ? planifiedDefisLui : planifiedDefisElle;
            const title = target === 'lui' ? 'Défi du jour - Pour lui ♂️' : 'Défi du jour - Pour elle ♀️';
            
            let content = `<h3 style="color:var(--accent-pink);">${title}</h3>`;
            if (list.length === 0) {
                content += `<p>Félicitations, tous les défis de cette catégorie ont été réalisés !</p>`;
            } else {
                const randomDefi = list[Math.floor(Math.random() * list.length)];
                content += `<p style="font-size: 1.1rem; line-height: 1.5; margin: 20px 0;">${randomDefi}</p>`;
            }
            content += `<button class="action-btn" onclick="closeModal()">Fermer</button>`;

            document.getElementById('modal-daily').style.display = 'none';
            document.getElementById('modal-generic-content').innerHTML = content;
            document.getElementById('modal-generic').style.display = 'flex';
        }

        function showPlanifiedList(targetPerson) {
            document.getElementById('levels-container').style.display = 'none';
            document.getElementById('card-display').style.display = 'none';

            const list = targetPerson === 'lui' ? planifiedDefisLui : planifiedDefisElle;
            const title = "Suivi des Défis Kinky";
            
            let itemsHtml = '';
            if (list.length === 0) {
                itemsHtml = `<p style="color:var(--text-muted); text-align:center; padding: 20px;">Aucun défi en attente dans cette catégorie.</p>`;
            } else {
                list.forEach((defi, index) => {
                    itemsHtml += `
                        <div class="defi-item">
                            <span>${defi}</span>
                            <button class="defi-done-btn" onclick="removeDefi('${targetPerson}', ${index})">Défi réalisé</button>
                        </div>
                    `;
                });
            }

            const overlay = document.getElementById('modal-generic-content');
            overlay.innerHTML = `
                <h3>${title}</h3>
                <div class="tab-buttons">
                    <button class="tab-btn ${targetPerson === 'lui' ? 'active' : ''}" onclick="showPlanifiedList('lui')">Pour Lui ♂️</button>
                    <button class="tab-btn ${targetPerson === 'elle' ? 'active' : ''}" onclick="showPlanifiedList('elle')">Pour Elle ♀️</button>
                </div>
                <div class="defis-list-container">
                    ${itemsHtml}
                </div>
                <button class="action-btn" style="margin-top:15px;" onclick="closeModal()">Fermer</button>
            `;

            document.getElementById('modal-generic').style.display = 'flex';
        }

        function removeDefi(targetPerson, index) {
            if (targetPerson === 'lui') {
                planifiedDefisLui.splice(index, 1);
            } else {
                planifiedDefisElle.splice(index, 1);
            }
            saveDefis();
            showPlanifiedList(targetPerson);
        }
    </script>
</body>
</html>
